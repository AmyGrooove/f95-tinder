name: bisky

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *default-logging

x-postal-environment: &postal-environment
  POSTAL_WEB_HOSTNAME: ${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  POSTAL_WEB_PROTOCOL: ${POSTAL_WEB_PROTOCOL:-https}
  POSTAL_SMTP_HOSTNAME: ${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  POSTAL_SIGNING_KEY_PATH: /config/signing.key

  MAIN_DB_HOST: postal-db
  MAIN_DB_PORT: "3306"
  MAIN_DB_USERNAME: root
  MAIN_DB_PASSWORD: ${POSTAL_DB_PASSWORD:?POSTAL_DB_PASSWORD is required}
  MAIN_DB_DATABASE: postal

  MESSAGE_DB_HOST: postal-db
  MESSAGE_DB_PORT: "3306"
  MESSAGE_DB_USERNAME: root
  MESSAGE_DB_PASSWORD: ${POSTAL_DB_PASSWORD:?POSTAL_DB_PASSWORD is required}
  MESSAGE_DB_DATABASE_NAME_PREFIX: postal

  DNS_MX_RECORDS: ${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  DNS_SPF_INCLUDE: spf.${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  DNS_RETURN_PATH_DOMAIN: rp.${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  DNS_ROUTE_DOMAIN: routes.${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  DNS_TRACK_DOMAIN: track.${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}
  DNS_HELO_HOSTNAME: ${POSTAL_HOSTNAME:?POSTAL_HOSTNAME is required}

  RAILS_SECRET_KEY: ${POSTAL_RAILS_SECRET:?POSTAL_RAILS_SECRET is required}

  WAIT_FOR_TARGETS: postal-db:3306
  WAIT_FOR_TIMEOUT: "90"

  MIGRATION_WAITER_ENABLED: "true"

x-postal-service: &postal-service
  <<: *service-defaults
  image: ghcr.io/postalserver/postal:3.3.7
  environment:
    <<: *postal-environment
  volumes:
    - postal_config:/config
  networks:
    - app
    - data
  depends_on:
    postal-db:
      condition: service_healthy

services:
  mongo:
    <<: *service-defaults
    image: mongo:8.3.11-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: bisky
    volumes:
      - mongo_data:/data/db
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep -q '^1$'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s

  redis:
    <<: *service-defaults
    image: redis:8.10.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q '^PONG$'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 2s

  minio:
    <<: *service-defaults
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
      pull: true
    image: bisky-minio-community:latest
    pull_policy: build
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ACCESS_SECRET:?MINIO_ACCESS_SECRET is required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-0.0.0.0}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s

  meilisearch:
    <<: *service-defaults
    image: getmeili/meilisearch:v1.53.2
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_ACCESS_SECRET:?MEILISEARCH_ACCESS_SECRET is required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_BIND_ADDRESS:-127.0.0.1}:${MEILISEARCH_PORT:-7700}:7700"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s

  openobserve:
    <<: *service-defaults
    build:
      context: ./docker/openobserve
      dockerfile: Dockerfile
    image: bisky-openobserve:v1.0.3
    pull_policy: build
    stop_grace_period: 60s
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USERNAME:?OPENOBSERVE_USERNAME is required}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD is required}
    volumes:
      - openobserve_data:/data
    ports:
      - "${OPENOBSERVE_BIND_ADDRESS:-127.0.0.1}:${OPENOBSERVE_PORT:-5080}:5080"
    networks:
      - app
      - data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
      start_interval: 2s

  postal-db:
    <<: *service-defaults
    image: mariadb:11.8.9-noble
    environment:
      MARIADB_DATABASE: postal
      MARIADB_ROOT_PASSWORD: ${POSTAL_DB_PASSWORD:?POSTAL_DB_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - postal_db_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
      start_interval: 2s

  postal-web:
    <<: *postal-service
    user: "0:0"
    command:
      - /bin/sh
      - -lc
      - |
        set -eu

        if [ ! -f /config/postal.yml ]; then
          printf 'version: 2\n' > /config/postal.yml
          chmod 644 /config/postal.yml
        fi

        if [ ! -f /config/signing.key ]; then
          openssl genrsa -out /config/signing.key 2048
          chmod 644 /config/signing.key
        fi

        if [ ! -f /config/.initialized ]; then
          /opt/postal/app/bin/postal initialize
          touch /config/.initialized
        fi

        chown -R 999:999 /config
        exec setpriv --reuid=999 --regid=999 --init-groups /opt/postal/app/bin/postal web-server
    environment:
      <<: *postal-environment
      WEB_SERVER_DEFAULT_BIND_ADDRESS: 0.0.0.0
      WEB_SERVER_DEFAULT_PORT: "5000"
    ports:
      - "${POSTAL_WEB_BIND_ADDRESS:-127.0.0.1}:${POSTAL_WEB_PORT:-5000}:5000"

  postal-smtp:
    <<: *postal-service
    command: /opt/postal/app/bin/postal smtp-server
    environment:
      <<: *postal-environment
      SMTP_SERVER_DEFAULT_PORT: "25"
      SMTP_SERVER_DEFAULT_BIND_ADDRESS: "::"
      SMTP_SERVER_DEFAULT_HEALTH_SERVER_BIND_ADDRESS: 0.0.0.0
    ports:
      - "${POSTAL_SMTP_BIND_ADDRESS:-0.0.0.0}:${POSTAL_SMTP_PORT:-25}:25"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/health | grep -q '^OK$'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
      start_interval: 2s

  postal-worker:
    <<: *postal-service
    command: /opt/postal/app/bin/postal worker
    environment:
      <<: *postal-environment
      WORKER_DEFAULT_HEALTH_SERVER_BIND_ADDRESS: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/health | grep -q '^OK$'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
      start_interval: 2s

  api:
    <<: *service-defaults
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      pull: true
    init: true
    environment:
      NODE_ENV: production
      APP_NAME: bisky
      APP_VERSION: 1.0.0
      APP_DESCRIPTION: Bisky API
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

      MONGO_URL: mongodb://root:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/bisky?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ACCESS_SECRET: ${MINIO_ACCESS_SECRET:?MINIO_ACCESS_SECRET is required}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}

      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_ACCESS_SECRET: ${MEILISEARCH_ACCESS_SECRET:?MEILISEARCH_ACCESS_SECRET is required}

      MAIL_DOMAIN: ${MAIL_DOMAIN:?MAIL_DOMAIN is required}
      SMTP_HOST: postal-smtp
      SMTP_PORT: "25"
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}

      OPENOBSERVE_URL: http://openobserve:5080/api/default/bisky/_json
      OPENOBSERVE_USERNAME: ${OPENOBSERVE_USERNAME:?OPENOBSERVE_USERNAME is required}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD is required}
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3000}:3000"
    networks:
      - app
      - data
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      meilisearch:
        condition: service_healthy
        restart: true
      openobserve:
        condition: service_healthy
        restart: true
      postal-smtp:
        condition: service_healthy
        restart: true
    pre_start:
      - image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
        environment:
          MC_HOST_local: http://${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}:${MINIO_ACCESS_SECRET:?MINIO_ACCESS_SECRET is required}@minio:9000
        command:
          - mc
          - mb
          - --ignore-existing
          - local/bisky

  web:
    <<: *service-defaults
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      pull: true
    init: true
    environment:
      API_URL: http://api:3000
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3001}:3000"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
        restart: true

volumes:
  mongo_data:
  redis_data:
  minio_data:
  meilisearch_data:
  openobserve_data:
  postal_db_data:
  postal_config:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
